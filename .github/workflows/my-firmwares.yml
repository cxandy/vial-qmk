# 只编译我自己维护的板子的固件。
#
# 和 ci.yml 分开的原因：ci.yml 的 build-vial job 会跑 `qmk mass-compile -km vial`，
# 也就是编译全仓库所有带 vial 键位的板子（本仓库有 638 个），需要数小时，
# 对 fork 来说没有意义。这里用位置参数把范围限定到 AZSMZ/48key_rev。
#
# 用法：Actions 页面 → My Firmwares → Run workflow → 选 keymap。
name: My Firmwares

on:
  workflow_dispatch:
    inputs:
      keymap:
        description: Which keymap to build
        type: choice
        options:
          - all
          - vial
          - test
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # QMK 的键盘名，带厂商前缀，喂给 qmk mass-compile 用。
  KEYBOARD: AZSMZ/48key_rev
  # mass-compile 产出的固件名是 <键盘名>_<键位>.bin，其中 / 被换成 _，
  # 所以 AZSMZ/48key_rev:vial 会得到 AZSMZ_48key_rev_vial.bin。
  # 换板子时这两个值要一起改。
  #
  # 注意: TARGET 是用通配符 AZSMZ_48key_rev_*.bin 匹配的，而
  # AZSMZ_48key_rev 是 AZSMZ_48key 的前缀，所以 TARGET 一旦改成
  # AZSMZ_48key，通配符会把 48key_rev 的固件也一起捞进来，
  # find | head -n 1 就可能挑错文件。届时需要按键位名精确匹配。
  TARGET: AZSMZ_48key_rev
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions: {}

jobs:
  build:
    name: Build AZSMZ/48key_rev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Resolve build targets
      id: targets
      run: |
        case "${{ inputs.keymap }}" in
          vial) echo "list=${KEYBOARD}:vial" >> "${GITHUB_OUTPUT}" ;;
          test) echo "list=${KEYBOARD}:test" >> "${GITHUB_OUTPUT}" ;;
          *)    echo "list=${KEYBOARD}:vial ${KEYBOARD}:test" >> "${GITHUB_OUTPUT}" ;;
        esac
        echo "Building: ${{ steps.targets.outputs.list }}"

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        if ! qmk mass-compile -j $(nproc) ${{ steps.targets.outputs.list }};
          then
          echo "::error::build failed, see logs and/or job summary for details."

          echo '### Failure logs' | tee -a "${GITHUB_STEP_SUMMARY}"
          for log in $(find / -type f -name 'failed.log.*' 2>/dev/null); do
            pretty_logname="$(basename "${log}" | sed "s/^failed\.log\.[0-9]\+\.//")"

            printf '\n::group::%s\n%s\n::endgroup::\n' "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT}" < "${log}")"
            printf '\n<details>\n<summary>%s</summary>\n\n```\n%s\n```\n\n</details>\n' \
              "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT} ; ${REGEX_ANSI_COLOR}" < "${log}")" >> "${GITHUB_STEP_SUMMARY}"
          done
          exit 1
        fi

    - name: Locate built firmware
      id: locate
      run: |
        # mass-compile puts the firmware in QMK_FIRMWARE/.build, and in this
        # container QMK_HOME=/qmk_firmware is not the checkout directory, so
        # the artifacts turn up in the workspace root instead. Check the known
        # locations first, then fall back to a filesystem search.
        echo "cwd=$(pwd)"
        echo "QMK_HOME=${QMK_HOME:-unset}"
        echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-unset}"

        found=""
        for dir in "${GITHUB_WORKSPACE}/.build" "${GITHUB_WORKSPACE}" "${QMK_HOME:-/nonexistent}/.build"; do
          match="$(find "${dir}" -maxdepth 1 -type f -name "${TARGET}_*.bin" 2>/dev/null | head -n 1)"
          if [ -n "${match}" ]; then
            found="${match}"
            break
          fi
        done
        if [ -z "${found}" ]; then
          found="$(find / -type f -name "${TARGET}_*.bin" 2>/dev/null | head -n 1)"
        fi
        if [ -z "${found}" ]; then
          echo "::error::no ${TARGET}_*.bin found after a successful build"
          exit 1
        fi

        echo "Found: ${found}"
        echo "dir=$(dirname "${found}")" >> "${GITHUB_OUTPUT}"

    # Only .bin is produced: HEXFILE_ENABLE is not set in this keymap, so there
    # is no .hex to collect. Add HEXFILE_ENABLE = yes to the keymap's rules.mk
    # if you ever want an Intel HEX alongside it.
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.TARGET }}-${{ inputs.keymap }}
        path: ${{ steps.locate.outputs.dir }}/${{ env.TARGET }}_*.bin
        # QMK writes to .build/, and upload-artifact v4 drops hidden directories
        # from glob results unless this is set, which silently yields nothing.
        include-hidden-files: true
        if-no-files-found: error